<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcade Shelf</title>
<style>
  :root{
    --bg:#f2efe6; --ink:#1d2a2a; --muted:#5b6868; --line:#c9c4b4;
    --accent:#2f6f6a; --panel:#e8e4d6; --focus:#d1495b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14201f; --ink:#e9efe8; --muted:#9db0ad; --line:#2d3f3d; --accent:#7fd1c7; --panel:#1b2b2a; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
  header{padding:28px 20px 12px;max-width:1100px;margin:0 auto}
  h1{margin:0;font-size:clamp(28px,5vw,44px);letter-spacing:-.01em}
  header p{margin:6px 0 0;color:var(--muted)}
  main{max-width:1100px;margin:0 auto;padding:12px 20px 40px}
  #search{width:100%;max-width:360px;padding:10px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;font:inherit}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:18px}
  .game{display:block;text-align:left;border:1px solid var(--line);background:var(--panel);color:inherit;border-radius:10px;padding:0;overflow:hidden;cursor:pointer;font:inherit}
  .game .thumb{aspect-ratio:16/10;background:var(--line) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--muted)}
  .game .meta{padding:10px 12px}
  .game strong{display:block}
  .game span{color:var(--muted);font-size:14px}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  #player{display:none;margin-top:18px}
  #player.on{display:block}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .bar h2{margin:0 auto 0 0;font-size:22px}
  button.act,a.act{padding:8px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;font:inherit;text-decoration:none;cursor:pointer}
  button.act:hover,a.act:hover{border-color:var(--accent)}
  #frame{width:100%;height:min(75vh,640px);border:1px solid var(--line);border-radius:8px;background:#000}
  #empty{color:var(--muted);margin-top:20px}
</style>
</head>
<body>
<header>
  <h1>Arcade Shelf</h1>
  <p>Pick a game. It runs right here in the page.</p>
</header>
<main>
  <section id="player" aria-live="polite">
    <div class="bar">
      <h2 id="ptitle"></h2>
      <button class="act" id="fs">Fullscreen</button>
      <a class="act" id="newtab" target="_blank" rel="noopener">Open in new tab</a>
      <button class="act" id="close">Back to games</button>
    </div>
    <iframe id="frame" title="Game" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
  </section>

  <section id="library">
    <input id="search" type="search" placeholder="Search games" aria-label="Search games">
    <div id="grid"></div>
    <p id="empty" hidden>No games match that search.</p>
  </section>
</main>

<script>
/* Add one entry per game. "path" is the folder under /games/ that holds the game's own index.html.
   "thumb" is optional (a small image file inside that folder). */
const GAMES = [
  { title: "AdVenture Capitalist", path: "games/adcap/", author: "You", thumb: "" },
  { title: "BitLife", path: "games/bitlife/", author: "You", thumb: "" }
  
];

const $ = id => document.getElementById(id);
const grid = $("grid"), frame = $("frame");

function render(list){
  grid.innerHTML = "";
  $("empty").hidden = list.length > 0;
  list.forEach(g => {
    const b = document.createElement("button");
    b.className = "game";
    b.innerHTML = '<div class="thumb"></div><div class="meta"><strong></strong><span></span></div>';
    const t = b.querySelector(".thumb");
    if (g.thumb) t.style.backgroundImage = "url('" + g.path + g.thumb + "')"; else t.textContent = g.title.charAt(0);
    b.querySelector("strong").textContent = g.title;
    b.querySelector("span").textContent = g.author ? "by " + g.author : "";
    b.onclick = () => play(g);
    grid.appendChild(b);
  });
}

function play(g){
  $("ptitle").textContent = g.title;
  frame.src = g.path;
  $("newtab").href = g.path;
  $("player").classList.add("on");
  $("library").hidden = true;
  location.hash = encodeURIComponent(g.path);
  $("player").scrollIntoView();
}

function back(){
  frame.src = "about:blank";
  $("player").classList.remove("on");
  $("library").hidden = false;
  history.replaceState(null, "", location.pathname);
}

$("close").onclick = back;
$("fs").onclick = () => frame.requestFullscreen && frame.requestFullscreen();
$("search").oninput = e => {
  const q = e.target.value.toLowerCase();
  render(GAMES.filter(g => g.title.toLowerCase().includes(q)));
};

render(GAMES);
const h = decodeURIComponent(location.hash.slice(1));
const start = GAMES.find(g => g.path === h);
if (start) play(start);
</script>
</body>
</html>
